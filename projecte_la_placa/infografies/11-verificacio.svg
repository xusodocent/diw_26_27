<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc"><title id="title">Provar també forma part de dissenyar</title><desc id="desc">Cicle de verificació: definir una tasca, observar, corregir i repetir per confirmar la millora.</desc><rect width="1100" height="470" rx="24" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="15" fill="#4338ca" font-weight="700">LA PLAÇA / PROJECTE GUIAT</text><text x="40" y="96" font-size="30" fill="#172554" font-weight="700">Provar també forma part de dissenyar</text><rect x="40.0" y="135" width="500.0" height="135" rx="16" fill="#eef2ff" stroke="none"/><text x="60.0" y="168" font-size="21" fill="#3730a3" font-weight="700">1 · DEFINEIX UNA TASCA</text><text x="60.0" y="203" font-size="18" fill="#172554" font-weight="400">Troba l’hora del taller</text><text x="60.0" y="228" font-size="18" fill="#172554" font-weight="400">Anota el resultat esperat</text><rect x="560.0" y="135" width="500.0" height="135" rx="16" fill="#eef2ff" stroke="none"/><text x="580.0" y="168" font-size="21" fill="#3730a3" font-weight="700">2 · OBSERVA EL RESULTAT</text><text x="580.0" y="203" font-size="18" fill="#172554" font-weight="400">Completa la tasca sense ajudar</text><text x="580.0" y="228" font-size="18" fill="#172554" font-weight="400">Registra el problema concret</text><rect x="40.0" y="290" width="500.0" height="135" rx="16" fill="#eef2ff" stroke="none"/><text x="60.0" y="323" font-size="21" fill="#3730a3" font-weight="700">3 · CORREGEIX LA CAUSA</text><text x="60.0" y="358" font-size="18" fill="#172554" font-weight="400">Canvia HTML o CSS</text><text x="60.0" y="383" font-size="18" fill="#172554" font-weight="400">Explica què has modificat</text><rect x="560.0" y="290" width="500.0" height="135" rx="16" fill="#eef2ff" stroke="none"/><text x="580.0" y="323" font-size="21" fill="#3730a3" font-weight="700">4 · TORNA A PROVAR</text><text x="580.0" y="358" font-size="18" fill="#172554" font-weight="400">Repeteix la mateixa tasca</text><text x="580.0" y="383" font-size="18" fill="#172554" font-weight="400">Compara abans i després</text></g></svg>