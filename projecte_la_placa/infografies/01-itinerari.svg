<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 755" role="img" aria-labelledby="title desc"><title id="title">7 fases · 19 passos · 36 hores orientatives</title><desc id="desc">Itinerari actualitzat amb set fases, dinou passos i trenta-sis hores orientatives.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6945bd"/></marker></defs><rect x="0" y="0" width="1100" height="755" rx="24" fill="#faf8f2" stroke="none"/><g font-family="Arial, sans-serif"><text x="40" y="48" fill="#6945bd" font-size="15" font-weight="700">LA PLAÇA / APRENENTATGE AUTÒNOM</text><text x="40" y="95" fill="#302052" font-size="30" font-weight="700">7 fases · 19 passos · 36 hores orientatives</text><rect x="40" y="130" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="60" y="162" fill="#302052" font-size="21" font-weight="700">01 · ANALITZA · 2 h</text><text x="60" y="197" fill="#302052" font-size="18" font-weight="400">01.1–01.2 · Encàrrec i mapa</text><text x="60" y="222" fill="#302052" font-size="18" font-weight="400">E1: necessitats, tasques i continguts</text><rect x="560" y="130" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="580" y="162" fill="#302052" font-size="21" font-weight="700">02 · DISSENYA · 4 h</text><text x="580" y="197" fill="#302052" font-size="18" font-weight="400">02.1–02.2 · Estructura i identitat</text><text x="580" y="222" fill="#302052" font-size="18" font-weight="400">E2: wireframes, estats i guia</text><rect x="40" y="280" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="60" y="312" fill="#302052" font-size="21" font-weight="700">03 · ESTRUCTURA · 4 h</text><text x="60" y="347" fill="#302052" font-size="18" font-weight="400">03.1–03.3 · Fitxers i HTML</text><text x="60" y="372" fill="#302052" font-size="18" font-weight="400">E3: tres pàgines connectades</text><rect x="560" y="280" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="580" y="312" fill="#302052" font-size="21" font-weight="700">04 · DONA ESTIL · 6 h</text><text x="580" y="347" fill="#302052" font-size="18" font-weight="400">04.1–04.3 · Components i diagnòstic</text><text x="580" y="372" fill="#302052" font-size="18" font-weight="400">E4: CSS, caixa i cascada</text><rect x="40" y="430" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="60" y="462" fill="#302052" font-size="21" font-weight="700">05 · COMPON · 7 h</text><text x="60" y="497" fill="#302052" font-size="18" font-weight="400">05.1–05.3 · Barra, submenú i graelles</text><text x="60" y="522" fill="#302052" font-size="18" font-weight="400">E5: primera versió maquetada</text><rect x="560" y="430" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="580" y="462" fill="#302052" font-size="21" font-weight="700">06 · ADAPTA · 8 h</text><text x="580" y="497" fill="#302052" font-size="18" font-weight="400">06.1–06.4 · Menú i efectes</text><text x="580" y="522" fill="#302052" font-size="18" font-weight="400">E6: responsive i fons fix</text><rect x="40" y="580" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="60" y="612" fill="#302052" font-size="21" font-weight="700">07 · VERIFICA · 5 h</text><text x="60" y="647" fill="#302052" font-size="18" font-weight="400">07.1–07.2 · Proves i explicació</text><text x="60" y="672" fill="#302052" font-size="18" font-weight="400">E7: versió final revisada</text><rect x="560" y="580" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="580" y="612" fill="#302052" font-size="21" font-weight="700">EN CADA PAS</text><text x="580" y="647" fill="#302052" font-size="18" font-weight="400">Construeix → prova → explica</text><text x="580" y="672" fill="#302052" font-size="18" font-weight="400">Consulta els apunts quan calga</text></g></svg>