<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 685" role="img" aria-labelledby="title desc"><title id="title">El contingut passa per damunt del fons</title><desc id="desc">Dos viewports amb el sol a la mateixa coordenada i el text a altures diferents; alternativa de fons normal en altres contextos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6945bd"/></marker></defs><rect x="0" y="0" width="1100" height="685" rx="24" fill="#faf8f2" stroke="none"/><g font-family="Arial, sans-serif"><text x="40" y="48" fill="#6945bd" font-size="15" font-weight="700">LA PLAÇA / APRENENTATGE AUTÒNOM</text><text x="40" y="95" fill="#302052" font-size="30" font-weight="700">El contingut passa per damunt del fons</text><text x="40" y="145" fill="#302052" font-size="21" font-weight="700">POSICIÓ DE SCROLL A</text><rect x="40" y="170" width="480" height="370" rx="16" fill="#302052" stroke="none"/><circle cx="405" cy="260" r="55" fill="#e9ff86"/><rect x="60" y="385" width="65" height="120" rx="3" fill="#79529e" stroke="none"/><rect x="150" y="385" width="65" height="120" rx="3" fill="#79529e" stroke="none"/><rect x="240" y="385" width="65" height="120" rx="3" fill="#79529e" stroke="none"/><rect x="330" y="385" width="65" height="120" rx="3" fill="#79529e" stroke="none"/><rect x="420" y="385" width="65" height="120" rx="3" fill="#79529e" stroke="none"/><rect x="60" y="330" width="430" height="80" rx="8" fill="#faf8f2" stroke="none"/><text x="80" y="380" fill="#302052" font-size="25" font-weight="700">TEXT DE LA SECCIÓ</text><text x="65" y="515" fill="white" font-size="18" font-weight="400">El sol continua al mateix lloc.</text><text x="580" y="145" fill="#302052" font-size="21" font-weight="700">POSICIÓ DE SCROLL B</text><rect x="580" y="170" width="480" height="370" rx="16" fill="#302052" stroke="none"/><circle cx="945" cy="260" r="55" fill="#e9ff86"/><rect x="600" y="385" width="65" height="120" rx="3" fill="#79529e" stroke="none"/><rect x="690" y="385" width="65" height="120" rx="3" fill="#79529e" stroke="none"/><rect x="780" y="385" width="65" height="120" rx="3" fill="#79529e" stroke="none"/><rect x="870" y="385" width="65" height="120" rx="3" fill="#79529e" stroke="none"/><rect x="960" y="385" width="65" height="120" rx="3" fill="#79529e" stroke="none"/><rect x="600" y="230" width="430" height="80" rx="8" fill="#faf8f2" stroke="none"/><text x="620" y="280" fill="#302052" font-size="25" font-weight="700">TEXT DE LA SECCIÓ</text><text x="605" y="515" fill="white" font-size="18" font-weight="400">El sol continua al mateix lloc.</text><text x="40" y="595" fill="#302052" font-size="23" font-weight="400">El text puja amb el document; el fons es referencia al viewport.</text><text x="40" y="635" fill="#302052" font-size="20" font-weight="400">En estret, punter gruixut o moviment reduït: background-attachment: scroll.</text></g></svg>