<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc"><title id="title">L’HTML explica què és cada cosa</title><desc id="desc">Estructura HTML semàntica amb capçalera, navegació, contingut principal, seccions, articles i peu.</desc><rect width="1100" height="470" rx="24" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="15" fill="#4338ca" font-weight="700">LA PLAÇA / PROJECTE GUIAT</text><text x="40" y="96" font-size="30" fill="#172554" font-weight="700">L’HTML explica què és cada cosa</text><rect x="40.0" y="135" width="500.0" height="135" rx="16" fill="#eef2ff" stroke="none"/><text x="60.0" y="168" font-size="21" fill="#3730a3" font-weight="700">HEADER + NAV</text><text x="60.0" y="203" font-size="18" fill="#172554" font-weight="400">Identitat i menú compartit</text><text x="60.0" y="228" font-size="18" fill="#172554" font-weight="400">La pàgina actual queda indicada</text><rect x="560.0" y="135" width="500.0" height="135" rx="16" fill="#eef2ff" stroke="none"/><text x="580.0" y="168" font-size="21" fill="#3730a3" font-weight="700">MAIN</text><text x="580.0" y="203" font-size="18" fill="#172554" font-weight="400">Un contingut principal per pàgina</text><text x="580.0" y="228" font-size="18" fill="#172554" font-weight="400">H1 únic i seccions amb títol</text><rect x="40.0" y="290" width="500.0" height="135" rx="16" fill="#eef2ff" stroke="none"/><text x="60.0" y="323" font-size="21" fill="#3730a3" font-weight="700">SECTION + ARTICLE</text><text x="60.0" y="358" font-size="18" fill="#172554" font-weight="400">Section agrupa un tema</text><text x="60.0" y="383" font-size="18" fill="#172554" font-weight="400">Article: activitat amb sentit propi</text><rect x="560.0" y="290" width="500.0" height="135" rx="16" fill="#eef2ff" stroke="none"/><text x="580.0" y="323" font-size="21" fill="#3730a3" font-weight="700">FOOTER</text><text x="580.0" y="358" font-size="18" fill="#172554" font-weight="400">Informació final i contacte</text><text x="580.0" y="383" font-size="18" fill="#172554" font-weight="400">Enllaços reals i descriptius</text></g></svg>