<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc"><title id="title">Una entrega que permet continuar</title><desc id="desc">Cada entrega conté codi, evidències i reflexió; el retorn orienta les correccions de la següent fase.</desc><rect width="1100" height="470" rx="24" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="15" fill="#4338ca" font-weight="700">LA PLAÇA / PROJECTE GUIAT</text><text x="40" y="96" font-size="30" fill="#172554" font-weight="700">Una entrega que permet continuar</text><rect x="40.0" y="135" width="500.0" height="135" rx="16" fill="#eef2ff" stroke="none"/><text x="60.0" y="168" font-size="21" fill="#3730a3" font-weight="700">CODI</text><text x="60.0" y="203" font-size="18" fill="#172554" font-weight="400">Versió completa del projecte</text><text x="60.0" y="228" font-size="18" fill="#172554" font-weight="400">HTML, CSS i recursos locals</text><rect x="560.0" y="135" width="500.0" height="135" rx="16" fill="#eef2ff" stroke="none"/><text x="580.0" y="168" font-size="21" fill="#3730a3" font-weight="700">EVIDÈNCIA</text><text x="580.0" y="203" font-size="18" fill="#172554" font-weight="400">Captura o resultat d’una prova</text><text x="580.0" y="228" font-size="18" fill="#172554" font-weight="400">No substitueix el codi</text><rect x="40.0" y="290" width="500.0" height="135" rx="16" fill="#eef2ff" stroke="none"/><text x="60.0" y="323" font-size="21" fill="#3730a3" font-weight="700">REFLEXIÓ</text><text x="60.0" y="358" font-size="18" fill="#172554" font-weight="400">Què he fet? Què em falla?</text><text x="60.0" y="383" font-size="18" fill="#172554" font-weight="400">Quin és el següent pas?</text><rect x="560.0" y="290" width="500.0" height="135" rx="16" fill="#eef2ff" stroke="none"/><text x="580.0" y="323" font-size="21" fill="#3730a3" font-weight="700">RETORN</text><text x="580.0" y="358" font-size="18" fill="#172554" font-weight="400">Tria dues correccions prioritàries</text><text x="580.0" y="383" font-size="18" fill="#172554" font-weight="400">Aplica-les abans de continuar</text></g></svg>