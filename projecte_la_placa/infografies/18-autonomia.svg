<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 605" role="img" aria-labelledby="title desc"><title id="title">Una sessió: comprendre, fer i verificar</title><desc id="desc">Rutina d’aprenentatge autònom amb sis accions repetibles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6945bd"/></marker></defs><rect x="0" y="0" width="1100" height="605" rx="24" fill="#faf8f2" stroke="none"/><g font-family="Arial, sans-serif"><text x="40" y="48" fill="#6945bd" font-size="15" font-weight="700">LA PLAÇA / APRENENTATGE AUTÒNOM</text><text x="40" y="95" fill="#302052" font-size="30" font-weight="700">Una sessió: comprendre, fer i verificar</text><rect x="40" y="130" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="60" y="162" fill="#302052" font-size="21" font-weight="700">1 · OBSERVA</text><text x="60" y="197" fill="#302052" font-size="18" font-weight="400">Quin resultat construiré?</text><text x="60" y="222" fill="#302052" font-size="18" font-weight="400">Mira la demo i el punt de partida.</text><rect x="560" y="130" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="580" y="162" fill="#302052" font-size="21" font-weight="700">2 · CONSULTA</text><text x="580" y="197" fill="#302052" font-size="18" font-weight="400">Quin concepte em falta?</text><text x="580" y="222" fill="#302052" font-size="18" font-weight="400">Obri l’apartat dels apunts enllaçat.</text><rect x="40" y="280" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="60" y="312" fill="#302052" font-size="21" font-weight="700">3 · PREDIU</text><text x="60" y="347" fill="#302052" font-size="18" font-weight="400">Què espere que faça aquesta regla?</text><text x="60" y="372" fill="#302052" font-size="18" font-weight="400">Escriu una hipòtesi breu.</text><rect x="560" y="280" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="580" y="312" fill="#302052" font-size="21" font-weight="700">4 · CONSTRUEIX</text><text x="580" y="347" fill="#302052" font-size="18" font-weight="400">Un canvi menut cada vegada.</text><text x="580" y="372" fill="#302052" font-size="18" font-weight="400">Escriu, guarda i recarrega.</text><rect x="40" y="430" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="60" y="462" fill="#302052" font-size="21" font-weight="700">5 · COMPROVA</text><text x="60" y="497" fill="#302052" font-size="18" font-weight="400">Compara resultat i predicció.</text><text x="60" y="522" fill="#302052" font-size="18" font-weight="400">Inspecciona i corregeix.</text><rect x="560" y="430" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="580" y="462" fill="#302052" font-size="21" font-weight="700">6 · EXPLICA</text><text x="580" y="497" fill="#302052" font-size="18" font-weight="400">Respon abans de veure la solució.</text><text x="580" y="522" fill="#302052" font-size="18" font-weight="400">Registra què has aprés i continua.</text></g></svg>