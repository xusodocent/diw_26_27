<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc"><title id="title">Una acció, diversos estats visibles</title><desc id="desc">Estats dels enllaços i components: normal, hover, focus visible i preferència de moviment reduït.</desc><rect width="1100" height="470" rx="24" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="15" fill="#4338ca" font-weight="700">LA PLAÇA / PROJECTE GUIAT</text><text x="40" y="96" font-size="30" fill="#172554" font-weight="700">Una acció, diversos estats visibles</text><rect x="40.0" y="135" width="500.0" height="135" rx="16" fill="#eef2ff" stroke="none"/><text x="60.0" y="168" font-size="21" fill="#3730a3" font-weight="700">NORMAL</text><text x="60.0" y="203" font-size="18" fill="#172554" font-weight="400">Es reconeix que és un enllaç</text><text x="60.0" y="228" font-size="18" fill="#172554" font-weight="400">Text clar i contrast llegible</text><rect x="560.0" y="135" width="500.0" height="135" rx="16" fill="#eef2ff" stroke="none"/><text x="580.0" y="168" font-size="21" fill="#3730a3" font-weight="700">HOVER</text><text x="580.0" y="203" font-size="18" fill="#172554" font-weight="400">El punter passa per damunt</text><text x="580.0" y="228" font-size="18" fill="#172554" font-weight="400">Canvi discret de color o ombra</text><rect x="40.0" y="290" width="500.0" height="135" rx="16" fill="#eef2ff" stroke="none"/><text x="60.0" y="323" font-size="21" fill="#3730a3" font-weight="700">FOCUS VISIBLE</text><text x="60.0" y="358" font-size="18" fill="#172554" font-weight="400">S’hi arriba amb el teclat</text><text x="60.0" y="383" font-size="18" fill="#172554" font-weight="400">Contorn visible i espai exterior</text><rect x="560.0" y="290" width="500.0" height="135" rx="16" fill="#eef2ff" stroke="none"/><text x="580.0" y="323" font-size="21" fill="#3730a3" font-weight="700">MOVIMENT REDUÏT</text><text x="580.0" y="358" font-size="18" fill="#172554" font-weight="400">La informació continua disponible</text><text x="580.0" y="383" font-size="18" fill="#172554" font-weight="400">Es retiren desplaçaments decoratius</text></g></svg>