<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 605" role="img" aria-labelledby="title desc"><title id="title">Menú: estat visual i estat funcional</title><desc id="desc">Estats coherents entre el botó, aria-expanded, hidden i el desplegable, inclosa l’alternativa sense script.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6945bd"/></marker></defs><rect x="0" y="0" width="1100" height="605" rx="24" fill="#faf8f2" stroke="none"/><g font-family="Arial, sans-serif"><text x="40" y="48" fill="#6945bd" font-size="15" font-weight="700">LA PLAÇA / APRENENTATGE AUTÒNOM</text><text x="40" y="95" fill="#302052" font-size="30" font-weight="700">Menú: estat visual i estat funcional</text><rect x="40" y="130" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="60" y="162" fill="#302052" font-size="21" font-weight="700">ESCRIPTORI</text><text x="60" y="197" fill="#302052" font-size="18" font-weight="400">Botó ocult · navegació visible</text><text x="60" y="222" fill="#302052" font-size="18" font-weight="400">Programa: details obert o tancat</text><rect x="560" y="130" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="580" y="162" fill="#302052" font-size="21" font-weight="700">MÒBIL TANCAT</text><text x="580" y="197" fill="#302052" font-size="18" font-weight="400">Botó Menú · expanded=false</text><text x="580" y="222" fill="#302052" font-size="18" font-weight="400">Nav hidden · submenú tancat</text><rect x="40" y="280" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="60" y="312" fill="#302052" font-size="21" font-weight="700">MÒBIL OBERT</text><text x="60" y="347" fill="#302052" font-size="18" font-weight="400">Botó Tanca · expanded=true</text><text x="60" y="372" fill="#302052" font-size="18" font-weight="400">Nav visible · Programa disponible</text><rect x="560" y="280" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="580" y="312" fill="#302052" font-size="21" font-weight="700">EIXIDA I RECUPERACIÓ</text><text x="580" y="347" fill="#302052" font-size="18" font-weight="400">Escape: submenú → menú</text><text x="580" y="372" fill="#302052" font-size="18" font-weight="400">Focus torna al control corresponent</text><rect x="40" y="430" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="60" y="462" fill="#302052" font-size="21" font-weight="700">CANVI D’AMPLÀRIA</text><text x="60" y="497" fill="#302052" font-size="18" font-weight="400">matchMedia detecta el context</text><text x="60" y="522" fill="#302052" font-size="18" font-weight="400">Recalcula visibilitat i estats</text><rect x="560" y="430" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="580" y="462" fill="#302052" font-size="21" font-weight="700">SENSE JAVASCRIPT</text><text x="580" y="497" fill="#302052" font-size="18" font-weight="400">Botó ocult · enllaços visibles</text><text x="580" y="522" fill="#302052" font-size="18" font-weight="400">details conserva el comportament</text></g></svg>