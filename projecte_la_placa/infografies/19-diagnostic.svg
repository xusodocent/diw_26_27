<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 605" role="img" aria-labelledby="title desc"><title id="title">Quan no funciona: redueix el problema</title><desc id="desc">Seqüència de diagnòstic des del fitxer fins a una petició d’ajuda concreta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6945bd"/></marker></defs><rect x="0" y="0" width="1100" height="605" rx="24" fill="#faf8f2" stroke="none"/><g font-family="Arial, sans-serif"><text x="40" y="48" fill="#6945bd" font-size="15" font-weight="700">LA PLAÇA / APRENENTATGE AUTÒNOM</text><text x="40" y="95" fill="#302052" font-size="30" font-weight="700">Quan no funciona: redueix el problema</text><rect x="40" y="130" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="60" y="162" fill="#302052" font-size="21" font-weight="700">1 · FITXER I RUTA</text><text x="60" y="197" fill="#302052" font-size="18" font-weight="400">He guardat el document correcte?</text><text x="60" y="222" fill="#302052" font-size="18" font-weight="400">S’ha carregat el CSS o el script?</text><rect x="560" y="130" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="580" y="162" fill="#302052" font-size="21" font-weight="700">2 · ESTRUCTURA</text><text x="580" y="197" fill="#302052" font-size="18" font-weight="400">Coincideixen classe, id i selector?</text><text x="580" y="222" fill="#302052" font-size="18" font-weight="400">Les etiquetes estan ben tancades?</text><rect x="40" y="280" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="60" y="312" fill="#302052" font-size="21" font-weight="700">3 · REGLA APLICADA</text><text x="60" y="347" fill="#302052" font-size="18" font-weight="400">Què diu el valor calculat?</text><text x="60" y="372" fill="#302052" font-size="18" font-weight="400">Hi ha una regla que la sobreescriu?</text><rect x="560" y="280" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="580" y="312" fill="#302052" font-size="21" font-weight="700">4 · CONTEXT</text><text x="580" y="347" fill="#302052" font-size="18" font-weight="400">Quina amplària i estat estic provant?</text><text x="580" y="372" fill="#302052" font-size="18" font-weight="400">Quines media queries estan actives?</text><rect x="40" y="430" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="60" y="462" fill="#302052" font-size="21" font-weight="700">5 · COMPARACIÓ</text><text x="60" y="497" fill="#302052" font-size="18" font-weight="400">Obri el punt de control a banda.</text><text x="60" y="522" fill="#302052" font-size="18" font-weight="400">Compara només la peça afectada.</text><rect x="560" y="430" width="500" height="130" rx="16" fill="#f0ebf6" stroke="none"/><text x="580" y="462" fill="#302052" font-size="21" font-weight="700">6 · PETICIÓ D’AJUDA</text><text x="580" y="497" fill="#302052" font-size="18" font-weight="400">Explica esperat, observat i prova feta.</text><text x="580" y="522" fill="#302052" font-size="18" font-weight="400">Aporta el fragment necessari.</text></g></svg>