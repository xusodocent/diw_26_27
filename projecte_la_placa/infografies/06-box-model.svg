<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">Quatre zones, quatre funcions</title><desc id="desc">Diagrama concèntric del model de caixa: marge exterior, vora, espai interior i contingut. Amb border-box, l’amplària inclou contingut, padding i border.</desc><rect width="1100" height="660" rx="24" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="15" fill="#4338ca" font-weight="700">LA PLAÇA / PROJECTE GUIAT</text><text x="40" y="96" font-size="30" fill="#172554" font-weight="700">Quatre zones, quatre funcions</text><rect x="60" y="150" width="980" height="410" rx="16" fill="#ffedd5" stroke="none"/><text x="80" y="185" font-size="22" fill="#9a3412" font-weight="700">MARGIN · separació exterior</text><rect x="130" y="215" width="840" height="295" rx="16" fill="#4338ca" stroke="none"/><text x="155" y="248" font-size="22" fill="#fff" font-weight="700">BORDER · límit de la caixa</text><rect x="165" y="270" width="770" height="205" rx="16" fill="#ccfbf1" stroke="none"/><text x="190" y="309" font-size="22" fill="#115e59" font-weight="700">PADDING · espai interior</text><rect x="245" y="335" width="610" height="100" rx="16" fill="#fff" stroke="none"/><text x="320" y="394" font-size="24" fill="#172554" font-weight="400">CONTINGUT · text o imatge</text><text x="60" y="610" font-size="23" fill="#172554" font-weight="400">Amb border-box: width inclou contingut + padding + border.</text></g></svg>