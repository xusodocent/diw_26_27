<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Qui és la referència del desplegable?</title><desc id="desc">El contenidor relatiu estableix la referència per al submenú absolut; en mòbil el panell torna al flux.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6945bd"/></marker></defs><rect x="0" y="0" width="1100" height="650" rx="24" fill="#faf8f2" stroke="none"/><g font-family="Arial, sans-serif"><text x="40" y="48" fill="#6945bd" font-size="15" font-weight="700">LA PLAÇA / APRENENTATGE AUTÒNOM</text><text x="40" y="95" fill="#302052" font-size="30" font-weight="700">Qui és la referència del desplegable?</text><rect x="70" y="170" width="960" height="350" rx="20" fill="#f0ebf6" stroke="#6945bd"/><text x="100" y="215" fill="#302052" font-size="25" font-weight="700">PARE · position: relative</text><rect x="120" y="255" width="350" height="65" rx="16" fill="#302052" stroke="none"/><text x="145" y="297" fill="white" font-size="24" font-weight="400">Programa</text><rect x="120" y="345" width="460" height="130" rx="12" fill="white" stroke="#ded8e6"/><text x="145" y="382" fill="#302052" font-size="23" font-weight="700">FILL · position: absolute</text><text x="145" y="420" fill="#302052" font-size="21" font-weight="400">top: calc(100% + .85rem)</text><text x="145" y="453" fill="#302052" font-size="21" font-weight="400">left: 0</text><path d="M495 285L750 285" stroke="#6945bd" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="680" y="345" fill="#302052" font-size="22" font-weight="400">El panell ix del flux.</text><text x="680" y="389" fill="#302052" font-size="20" font-weight="400">El pare continua al seu lloc.</text><text x="70" y="580" fill="#302052" font-size="22" font-weight="400">En mòbil: position: static retorna el panell al flux de la navegació.</text></g></svg>