<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc"><title id="title">Per què guanya una regla?</title><desc id="desc">Resum de la cascada per a les regles del projecte. Primer context, després especificitat i ordre en empats. Comprovació amb les eines del navegador.</desc><rect width="1100" height="470" rx="24" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="15" fill="#4338ca" font-weight="700">LA PLAÇA / PROJECTE GUIAT</text><text x="40" y="96" font-size="30" fill="#172554" font-weight="700">Per què guanya una regla?</text><rect x="40.0" y="135" width="500.0" height="135" rx="16" fill="#eef2ff" stroke="none"/><text x="60.0" y="168" font-size="21" fill="#3730a3" font-weight="700">1 · COMPROVA EL CONTEXT</text><text x="60.0" y="203" font-size="18" fill="#172554" font-weight="400">Regles que afecten l’element</text><text x="60.0" y="228" font-size="18" fill="#172554" font-weight="400">Origen, importància i capes</text><rect x="560.0" y="135" width="500.0" height="135" rx="16" fill="#eef2ff" stroke="none"/><text x="580.0" y="168" font-size="21" fill="#3730a3" font-weight="700">2 · COMPARA ESPECIFICITAT</text><text x="580.0" y="203" font-size="18" fill="#172554" font-weight="400">#id supera .classe</text><text x="580.0" y="228" font-size="18" fill="#172554" font-weight="400">.classe supera etiqueta</text><rect x="40.0" y="290" width="500.0" height="135" rx="16" fill="#eef2ff" stroke="none"/><text x="60.0" y="323" font-size="21" fill="#3730a3" font-weight="700">3 · SI HI HA EMPAT</text><text x="60.0" y="358" font-size="18" fill="#172554" font-weight="400">En les regles simples del projecte,</text><text x="60.0" y="383" font-size="18" fill="#172554" font-weight="400">guanya la declaració posterior</text><rect x="560.0" y="290" width="500.0" height="135" rx="16" fill="#eef2ff" stroke="none"/><text x="580.0" y="323" font-size="21" fill="#3730a3" font-weight="700">4 · INSPECCIONA</text><text x="580.0" y="358" font-size="18" fill="#172554" font-weight="400">Regla ratllada: sobreescrita</text><text x="580.0" y="383" font-size="18" fill="#172554" font-weight="400">Computed: valor final aplicat</text></g></svg>